name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Promote CHANGELOG & Publish Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            RAW="${{ github.event.release.tag_name }}"
          else
            RAW="${{ github.event.inputs.version }}"
          fi
          VERSION="${RAW#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Unable to resolve the release version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify build.gradle.kts version matches the release
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(grep -oP '^version\s*=\s*"\K[^"]+' build.gradle.kts | head -n1)"
          RELEASE_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PROJECT_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::build.gradle.kts version ($PROJECT_VERSION) does not match release ($RELEASE_VERSION)."
            exit 1
          fi

      - name: Verify build and tests
        run: ./gradlew build --stacktrace

      - name: Promote '## [Unreleased]' in CHANGELOG.md
        run: |
          set -euo pipefail
          chmod +x .github/scripts/promote-changelog.sh
          .github/scripts/promote-changelog.sh CHANGELOG.md "${{ steps.version.outputs.version }}"

      - name: Commit CHANGELOG.md
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "No CHANGELOG.md changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): promote ${{ steps.version.outputs.version }} in CHANGELOG.md [skip ci]"
          git push origin main

      - name: Publish plugin to the Gradle Plugin Portal
        run: ./gradlew publishPlugins --stacktrace
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
