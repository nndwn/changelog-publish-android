name: Draft Release

on:
  workflow_run:
    workflows: ["Build"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft:
    name: Draft Release
    # Only run when the triggering 'Build' workflow succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from build.gradle.kts
        id: version
        run: |
          set -euo pipefail
          VERSION="$(grep -oP '^version\s*=\s*"\K[^"]+' build.gradle.kts | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "::error::Unable to resolve version from build.gradle.kts"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip when the version is already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > /tmp/release_state 2>/dev/null; then
            if [ "$(cat /tmp/release_state)" = "false" ]; then
              echo "Release $TAG is already published. Skipping draft."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Extract '## [Unreleased]' notes from CHANGELOG.md
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          awk '/^## \[Unreleased\]/{f=1;next} f&&/^## /{exit} f' CHANGELOG.md > release_notes.md
          if [ -z "$(tr -d '[:space:]' < release_notes.md)" ]; then
            echo "::error::Section '## [Unreleased]' in CHANGELOG.md is empty."
            exit 1
          fi
          echo "----- release notes -----"
          cat release_notes.md

      - name: Create or update draft release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
